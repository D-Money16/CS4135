spring.application.name=elib-lending
server.port=9923

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

catalogue.service.url=${CATALOGUE_SERVICE_URL:http://localhost:9922}

spring.datasource.url=jdbc:postgresql://localhost:5432/mydb?currentSchema=lending
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.catalogueService.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogueService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogueService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogueService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogueService.register-health-indicator=true

# Resilience4j Retry configuration
resilience4j.retry.instances.catalogueService.max-attempts=3
resilience4j.retry.instances.catalogueService.wait-duration=500ms

# Resilience4j TimeLimiter configuration
resilience4j.timelimiter.instances.catalogueService.timeout-duration=5s

# Actuator - expose circuit breaker health
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
notification.service.url=http://localhost:9924
