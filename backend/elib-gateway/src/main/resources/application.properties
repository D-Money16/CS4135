spring.application.name=elib-gateway
server.port=9920

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.function=DEBUG

# Service URLs - override with env vars in Docker (e.g. IDENTITY_SERVICE_URL=http://elib-identity:9921)
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:9921}
catalogue.service.url=${CATALOGUE_SERVICE_URL:http://localhost:9922}
lending.service.url=${LENDING_SERVICE_URL:http://localhost:9923}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:9924}
bookclub.service.url=${BOOKCLUB_SERVICE_URL:http://localhost:9925}

# Routes
spring.cloud.gateway.mvc.routes[0].id=identity-service
spring.cloud.gateway.mvc.routes[0].uri=${identity.service.url}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.mvc.routes[1].id=catalogue-service
spring.cloud.gateway.mvc.routes[1].uri=${catalogue.service.url}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/book-catalogue/**

spring.cloud.gateway.mvc.routes[2].id=lending-service
spring.cloud.gateway.mvc.routes[2].uri=${lending.service.url}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/lending/**

spring.cloud.gateway.mvc.routes[3].id=notification-service
spring.cloud.gateway.mvc.routes[3].uri=${notification.service.url}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.mvc.routes[4].id=bookclub-service
spring.cloud.gateway.mvc.routes[4].uri=${bookclub.service.url}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/bookclub/**
