spring.application.name=elib-gateway
server.port=9920

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.function=DEBUG

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.mvc.routes[0].id=identity-service
spring.cloud.gateway.mvc.routes[0].uri=lb://elib-identity
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.mvc.routes[1].id=catalogue-service
spring.cloud.gateway.mvc.routes[1].uri=lb://elib-catalogue
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/book-catalogue/**

spring.cloud.gateway.mvc.routes[2].id=lending-service
spring.cloud.gateway.mvc.routes[2].uri=lb://elib-lending
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/lending/**

spring.cloud.gateway.mvc.routes[3].id=notification-service
spring.cloud.gateway.mvc.routes[3].uri=lb://elib-notification
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.mvc.routes[4].id=bookclub-service
spring.cloud.gateway.mvc.routes[4].uri=lb://elib-bookclub
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/bookclub/**

# Gateway Circuit Breaker filters
spring.cloud.gateway.mvc.routes[0].filters[0]=CircuitBreaker=identityCB
spring.cloud.gateway.mvc.routes[1].filters[0]=CircuitBreaker=catalogueCB
spring.cloud.gateway.mvc.routes[2].filters[0]=CircuitBreaker=lendingCB
spring.cloud.gateway.mvc.routes[3].filters[0]=CircuitBreaker=notificationCB
spring.cloud.gateway.mvc.routes[4].filters[0]=CircuitBreaker=bookclubCB

# Resilience4j Circuit Breaker defaults for gateway
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# Apply default config to all gateway circuit breakers
resilience4j.circuitbreaker.instances.identityCB.base-config=default
resilience4j.circuitbreaker.instances.catalogueCB.base-config=default
resilience4j.circuitbreaker.instances.lendingCB.base-config=default
resilience4j.circuitbreaker.instances.notificationCB.base-config=default
resilience4j.circuitbreaker.instances.bookclubCB.base-config=default

# Resilience4j TimeLimiter (timeout) for gateway routes
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.instances.identityCB.base-config=default
resilience4j.timelimiter.instances.catalogueCB.base-config=default
resilience4j.timelimiter.instances.lendingCB.base-config=default
resilience4j.timelimiter.instances.notificationCB.base-config=default
resilience4j.timelimiter.instances.bookclubCB.base-config=default

# Actuator endpoints for monitoring circuit breakers
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
