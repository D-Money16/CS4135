services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  elib-identity:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-identity
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/mydb?currentSchema=identity
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword

  elib-catalogue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-catalogue
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/mydb?currentSchema=catalogue
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword

  elib-lending:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-lending
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/mydb?currentSchema=lending
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword

  elib-notification:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-notification
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083

  elib-bookclub:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-bookclub
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084

  elib-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: elib-gateway
    ports:
      - "8080:8080"
    depends_on:
      - elib-identity
      - elib-catalogue
      - elib-lending
      - elib-notification
      - elib-bookclub
    environment:
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://elib-identity:8082
      CATALOGUE_SERVICE_URL: http://elib-catalogue:8081
      LENDING_SERVICE_URL: http://elib-lending:8085
      NOTIFICATION_SERVICE_URL: http://elib-notification:8083
      BOOKCLUB_SERVICE_URL: http://elib-bookclub:8084

volumes:
  postgres_data:
