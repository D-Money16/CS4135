<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eLib — My Loans</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; min-height: 100vh; color: #0f172a; }

    nav { background: #fff; border-bottom: 1px solid #e2e8f0; padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 1rem; }
    .nav-logo { font-size: 1.4rem; font-weight: 800; color: #2563eb; white-space: nowrap; }
    .nav-links { display: flex; gap: .25rem; }
    .nav-links a { text-decoration: none; color: #64748b; font-size: .9rem; font-weight: 500; padding: .35rem .75rem; border-radius: 6px; transition: all .15s; }
    .nav-links a:hover { color: #2563eb; background: #eff6ff; }
    .nav-links a.active { color: #2563eb; background: #eff6ff; font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { font-size: .875rem; color: #64748b; white-space: nowrap; }
    .nav-user span { font-weight: 600; color: #0f172a; }
    .btn-logout { background: none; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: .35rem .85rem; font-size: .875rem; cursor: pointer; color: #64748b; transition: all .15s; }
    .btn-logout:hover { border-color: #dc2626; color: #dc2626; }

    main { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .3rem; }
    .sub { font-size: .9rem; color: #64748b; margin-bottom: 1.75rem; }

    .section-title { font-size: 1rem; font-weight: 700; color: #374151; margin: 1.75rem 0 .9rem; display: flex; align-items: center; gap: .5rem; }
    .count-badge { background: #e2e8f0; color: #475569; font-size: .75rem; font-weight: 600; padding: .15rem .5rem; border-radius: 20px; }

    .loan-card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.1rem 1.25rem; margin-bottom: .75rem; display: flex; align-items: center; gap: 1rem; transition: box-shadow .15s; }
    .loan-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .loan-card.overdue { border-left: 4px solid #dc2626; }
    .loan-info { flex: 1; min-width: 0; }
    .loan-title { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .loan-dates { font-size: .8rem; color: #64748b; margin-top: .25rem; }
    .loan-right { display: flex; align-items: center; gap: .75rem; flex-shrink: 0; }

    .status-badge { font-size: .78rem; font-weight: 700; padding: .25rem .65rem; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .status-active   { background: #eff6ff; color: #2563eb; }
    .status-overdue  { background: #fef2f2; color: #dc2626; }
    .status-returned { background: #f0fdf4; color: #16a34a; }

    .due-indicator { font-size: .8rem; font-weight: 600; }
    .due-ok      { color: #16a34a; }
    .due-soon    { color: #d97706; }
    .due-overdue { color: #dc2626; }

    .btn-return { background: #f0fdf4; color: #16a34a; border: 1.5px solid #bbf7d0; border-radius: 8px; padding: .4rem .9rem; font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn-return:hover { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn-return:disabled { opacity: .5; cursor: not-allowed; }

    .loading { text-align: center; padding: 3rem; color: #94a3b8; }
    .empty { text-align: center; padding: 3rem 2rem; color: #94a3b8; }
    .empty .icon { font-size: 2.5rem; margin-bottom: .75rem; }

    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; color: #fff; padding: .7rem 1.2rem; border-radius: 8px; font-size: .875rem; opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; z-index: 100; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: #15803d; }
    #toast.error { background: #dc2626; }
    .hidden { display: none; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">📚 eLib</div>
  <div class="nav-links">
    <a href="/books">Books</a>
    <a href="/loans" class="active">My Loans</a>
    <a href="/">Book Clubs</a>
  </div>
  <div class="nav-right">
    <div class="nav-user">Signed in as <span id="navUsername">…</span></div>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </div>
</nav>

<main>
  <h1>My Loans</h1>
  <p class="sub">Books you have borrowed. Return them before the due date.</p>

  <div id="loansContainer" class="loading">Loading loans…</div>
</main>

<div id="toast"></div>

<script>
  const API = 'http://localhost:9920';
  const token  = localStorage.getItem('token');
  const userId = localStorage.getItem('userId');
  const username = localStorage.getItem('username') || 'User';

  if (!token || !userId) { window.location.href = '/login'; }

  document.getElementById('navUsername').textContent = username;
  document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/login'; });

  async function api(path, options = {}) {
    const res = await fetch(`${API}${path}`, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, 'X-User-Id': userId, ...(options.headers || {}) }
    });
    if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
    return res;
  }

  function toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = type ? `show ${type}` : 'show';
    setTimeout(() => t.className = '', 3000);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function daysUntil(dateStr) {
    const due = new Date(dateStr);
    const now = new Date();
    due.setHours(0,0,0,0); now.setHours(0,0,0,0);
    return Math.round((due - now) / 86400000);
  }

  function dueLabelHtml(loan) {
    if (loan.status === 'RETURNED') return '';
    const days = daysUntil(loan.dueDate);
    if (days < 0)  return `<span class="due-indicator due-overdue">${Math.abs(days)}d overdue</span>`;
    if (days === 0) return `<span class="due-indicator due-overdue">Due today</span>`;
    if (days <= 3) return `<span class="due-indicator due-soon">${days}d left</span>`;
    return `<span class="due-indicator due-ok">${days}d left</span>`;
  }

  function statusBadge(status) {
    const map = { ACTIVE: 'status-active', OVERDUE: 'status-overdue', RETURNED: 'status-returned' };
    return `<span class="status-badge ${map[status] || ''}">${status}</span>`;
  }

  // client-side refs for loans to avoid exposing UUIDs in the DOM
  const loanRefs = {};
  function loanRefsClear() { for (const k in loanRefs) delete loanRefs[k]; }

  function loanCard(loan, bookTitle, ref) {
    const isActive = loan.status === 'ACTIVE' || loan.status === 'OVERDUE';
    const overdueCls = loan.status === 'OVERDUE' ? ' overdue' : '';
    return `
      <div class="loan-card${overdueCls}" id="loan-${ref}">
        <div class="loan-info">
          <div class="loan-title">${escHtml(bookTitle)}</div>
          <div class="loan-dates">
            Borrowed: ${formatDate(loan.borrowedAt)} · Due: ${formatDate(loan.dueDate)}
            ${loan.returnedAt ? ` · Returned: ${formatDate(loan.returnedAt)}` : ''}
          </div>
        </div>
        <div class="loan-right">
          ${dueLabelHtml(loan)}
          ${statusBadge(loan.status)}
          ${isActive ? `<button class="btn-return" data-ref="${ref}">Return</button>` : ''}
        </div>
      </div>`;
  }

  async function loadLoans() {
    const c = document.getElementById('loansContainer');
    try {
      const [loansRes, booksRes] = await Promise.all([
        api(`/api/lending/loans/user/${userId}`),
        api('/api/book-catalogue/books')
      ]);

      const loans = loansRes.ok ? await loansRes.json() : [];
      const books = booksRes.ok ? await booksRes.json() : [];
      const bookMap = Object.fromEntries(books.map(b => [b.id, b.title]));

      if (!loans.length) {
        c.className = '';
        c.innerHTML = `<div class="empty"><div class="icon">📋</div><p>You have no loans yet. <a href="/books" style="color:#2563eb;font-weight:600">Browse books</a> to borrow one.</p></div>`;
        return;
      }

      const active   = loans.filter(l => l.status === 'ACTIVE' || l.status === 'OVERDUE');
      const returned = loans.filter(l => l.status === 'RETURNED');

      // build HTML and populate short refs
      loanRefsClear();
      let idx = 0;
      let html = '';

      if (active.length) {
        html += `<div class="section-title">Active <span class="count-badge">${active.length}</span></div>`;
        html += active.map(l => { const ref = 'l' + (idx++); loanRefs[ref] = l.id; return loanCard(l, bookMap[l.bookId] || 'Unknown Book', ref); }).join('');
      }

      if (returned.length) {
        html += `<div class="section-title">History <span class="count-badge">${returned.length}</span></div>`;
        html += returned.map(l => { const ref = 'l' + (idx++); loanRefs[ref] = l.id; return loanCard(l, bookMap[l.bookId] || 'Unknown Book', ref); }).join('');
      }

      c.className = ''; c.innerHTML = html;

      // attach listeners for return buttons without exposing UUIDs
      document.querySelectorAll('button.btn-return[data-ref]').forEach(btn => {
        btn.addEventListener('click', function () {
          const ref = this.dataset.ref;
          returnBook(loanRefs[ref], this);
        });
      });

    } catch {
      c.className = ''; c.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>Could not load loans. Is the lending service running?</p></div>`;
    }
  }

  async function returnBook(loanId, btn) {
    btn.disabled = true; btn.textContent = 'Returning…';
    try {
      const res = await api(`/api/lending/loans/${loanId}/return`, { method: 'POST' });
      if (res.ok) {
        toast('Book returned successfully!', 'success');
        loadLoans();
      } else {
        const msg = await res.text();
        toast(msg || 'Could not return book.', 'error');
        btn.disabled = false; btn.textContent = 'Return';
      }
    } catch { toast('Request failed.', 'error'); btn.disabled = false; btn.textContent = 'Return'; }
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadLoans();
</script>
</body>
</html>
