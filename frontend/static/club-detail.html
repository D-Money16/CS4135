<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eLib — Club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; min-height: 100vh; color: #0f172a; }

    nav { background: #fff; border-bottom: 1px solid #e2e8f0; padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 1rem; }
    .nav-logo { font-size: 1.4rem; font-weight: 800; color: #2563eb; white-space: nowrap; }
    .nav-links { display: flex; gap: .25rem; }
    .nav-links a { text-decoration: none; color: #64748b; font-size: .9rem; font-weight: 500; padding: .35rem .75rem; border-radius: 6px; transition: all .15s; }
    .nav-links a:hover { color: #2563eb; background: #eff6ff; }
    .nav-links a.active { color: #2563eb; background: #eff6ff; font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { font-size: .875rem; color: #64748b; white-space: nowrap; }
    .nav-user span { font-weight: 600; color: #0f172a; }
    .btn-logout { background: none; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: .35rem .85rem; font-size: .875rem; cursor: pointer; color: #64748b; transition: all .15s; }
    .btn-logout:hover { border-color: #dc2626; color: #dc2626; }

    main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }

    .club-header { margin-bottom: 1.5rem; }
    .club-header .back { text-decoration: none; color: #64748b; font-size: .85rem; display: inline-flex; align-items: center; gap: .35rem; margin-bottom: .75rem; }
    .club-header .back:hover { color: #2563eb; }
    .club-header h1 { font-size: 1.6rem; font-weight: 800; }
    .club-header p { color: #64748b; font-size: .9rem; margin-top: .3rem; }

    .tabs { display: flex; gap: .25rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; }
    .tab { padding: .6rem 1.1rem; font-size: .9rem; font-weight: 600; color: #64748b; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab:hover { color: #2563eb; }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Messages */
    .messages-wrap { display: flex; flex-direction: column; height: calc(100vh - 320px); min-height: 300px; }
    .messages-feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .65rem; padding-right: .25rem; margin-bottom: 1rem; }
    .message-bubble { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: .9rem 1.1rem; }
    .message-bubble.mine { border-color: #bfdbfe; background: #eff6ff; }
    .msg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .4rem; gap: 1rem; }
    .msg-author { font-size: .8rem; font-weight: 700; color: #374151; }
    .msg-time { font-size: .75rem; color: #94a3b8; white-space: nowrap; }
    .msg-content { font-size: .9rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg-edited { font-size: .72rem; color: #94a3b8; margin-top: .3rem; }
    .msg-actions { margin-top: .5rem; display: flex; gap: .5rem; }
    .btn-msg-action { background: none; border: none; font-size: .78rem; cursor: pointer; color: #94a3b8; padding: .1rem .2rem; transition: color .15s; }
    .btn-msg-action:hover { color: #2563eb; }
    .btn-msg-action.del:hover { color: #dc2626; }

    .post-form { display: flex; gap: .75rem; align-items: flex-end; }
    .post-form textarea { flex: 1; padding: .65rem .85rem; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: .9rem; font-family: inherit; outline: none; resize: none; min-height: 44px; max-height: 120px; transition: border-color .15s; line-height: 1.4; }
    .post-form textarea:focus { border-color: #2563eb; }
    .btn-send { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: .6rem 1.1rem; font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .15s; white-space: nowrap; }
    .btn-send:hover { background: #1d4ed8; }
    .btn-send:disabled { background: #93c5fd; cursor: not-allowed; }

    /* Edit inline */
    .edit-area { width: 100%; padding: .5rem .7rem; border: 1.5px solid #2563eb; border-radius: 8px; font-size: .9rem; font-family: inherit; outline: none; resize: none; min-height: 60px; margin-top: .4rem; }
    .edit-actions { display: flex; gap: .5rem; margin-top: .4rem; }
    .btn-save { background: #2563eb; color: #fff; border: none; border-radius: 7px; padding: .3rem .75rem; font-size: .8rem; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #1d4ed8; }
    .btn-discard { background: none; border: 1px solid #e2e8f0; border-radius: 7px; padding: .3rem .75rem; font-size: .8rem; cursor: pointer; color: #64748b; }

    /* Members */
    .member-row { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: .85rem 1.1rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
    .member-name { font-weight: 600; font-size: .9rem; }
    .member-id { font-size: .75rem; color: #94a3b8; margin-top: .15rem; }
    .role-badge { font-size: .75rem; font-weight: 700; padding: .2rem .6rem; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
    .role-owner     { background: #fef3c7; color: #92400e; }
    .role-moderator { background: #ede9fe; color: #5b21b6; }
    .role-member    { background: #f1f5f9; color: #475569; }

    .loading { text-align: center; padding: 3rem; color: #94a3b8; }
    .empty { text-align: center; padding: 2rem; color: #94a3b8; }

    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; color: #fff; padding: .7rem 1.2rem; border-radius: 8px; font-size: .875rem; opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; z-index: 100; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: #15803d; }
    #toast.error { background: #dc2626; }
    .hidden { display: none; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">📚 eLib</div>
  <div class="nav-links">
    <a href="/books">Books</a>
    <a href="/loans">My Loans</a>
    <a href="/" class="active">Book Clubs</a>
  </div>
  <div class="nav-right">
    <div class="nav-user">Signed in as <span id="navUsername">…</span></div>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </div>
</nav>

<main>
  <div class="club-header">
    <a href="/" class="back">← Back to Clubs</a>
    <h1 id="clubName">Loading…</h1>
    <p id="clubDesc"></p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="messages">💬 Messages</button>
    <button class="tab" data-tab="members">👥 Members</button>
  </div>

  <!-- Messages tab -->
  <div class="tab-pane active" id="tab-messages">
    <div class="messages-wrap">
      <div class="messages-feed" id="messagesFeed"><div class="loading">Loading messages…</div></div>
      <div class="post-form">
        <textarea id="msgInput" placeholder="Write a message… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
        <button class="btn-send" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <!-- Members tab -->
  <div class="tab-pane" id="tab-members">
    <div id="membersList" class="loading">Loading members…</div>
  </div>
</main>

<div id="toast"></div>

<script>
  const API = 'http://localhost:9920';
  const token   = localStorage.getItem('token');
  const userId  = localStorage.getItem('userId');
  const username= localStorage.getItem('username') || 'User';

  if (!token || !userId) { window.location.href = '/login'; }

  const clubId = new URLSearchParams(location.search).get('id');
  if (!clubId) { window.location.href = '/'; }

  document.getElementById('navUsername').textContent = username;
  document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = '/login'; });

  async function api(path, options = {}) {
    const res = await fetch(`${API}${path}`, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, 'X-User-Id': userId, ...(options.headers || {}) }
    });
    if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
    return res;
  }

  function toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = type ? `show ${type}` : 'show';
    setTimeout(() => t.className = '', 3000);
  }

  function timeAgo(dateStr) {
    const diff = (Date.now() - new Date(dateStr)) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  // ── Tabs ──
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
      if (tab.dataset.tab === 'members') loadMembers();
    });
  });

  // ── Load club info ──
  async function loadClub() {
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}`);
      if (res.ok) {
        const club = await res.json();
        document.getElementById('clubName').textContent = club.name;
        document.getElementById('clubDesc').textContent = club.description || '';
        document.title = `eLib — ${club.name}`;
      }
    } catch {}
  }

  // ── Messages ──
  let page = 0;
  const PAGE_SIZE = 20;

  async function loadMessages() {
    const feed = document.getElementById('messagesFeed');
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}/messages?page=${page}&size=${PAGE_SIZE}`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      const msgs = data.content || data;

      if (!msgs.length && page === 0) {
        feed.innerHTML = `<div class="empty">No messages yet. Be the first to say something!</div>`;
        return;
      }

      feed.innerHTML = msgs.map(m => renderMessage(m)).join('');
      feed.scrollTop = feed.scrollHeight;
    } catch {
      feed.innerHTML = `<div class="empty">Could not load messages.</div>`;
    }
  }

  function renderMessage(m) {
    const mine = m.authorUserId === userId;
    const edited = m.editedAt ? `<div class="msg-edited">edited</div>` : '';
    const actions = mine
      ? `<div class="msg-actions">
           <button class="btn-msg-action" onclick="startEdit('${m.messageId}',this)">Edit</button>
           <button class="btn-msg-action del" onclick="deleteMsg('${m.messageId}',this)">Delete</button>
         </div>`
      : '';
    return `
      <div class="message-bubble${mine ? ' mine' : ''}" id="msg-${m.messageId}">
        <div class="msg-header">
          <span class="msg-author">${mine ? 'You' : 'User ' + m.authorUserId.substring(0,8)}</span>
          <span class="msg-time">${timeAgo(m.sentAt)}</span>
        </div>
        <div class="msg-content" id="content-${m.messageId}">${escHtml(m.content?.value || m.content || '')}</div>
        ${edited}
        ${actions}
      </div>`;
  }

  function startEdit(msgId, btn) {
    const contentEl = document.getElementById(`content-${msgId}`);
    const current = contentEl.textContent;
    contentEl.innerHTML = `
      <textarea class="edit-area" id="edit-${msgId}">${escHtml(current)}</textarea>
      <div class="edit-actions">
        <button class="btn-save" onclick="saveEdit('${msgId}')">Save</button>
        <button class="btn-discard" onclick="loadMessages()">Discard</button>
      </div>`;
  }

  async function saveEdit(msgId) {
    const val = document.getElementById(`edit-${msgId}`).value.trim();
    if (!val) return;
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}/messages/${msgId}`, {
        method: 'PUT', body: JSON.stringify({ content: val })
      });
      if (res.ok) { toast('Message updated.', 'success'); loadMessages(); }
      else { const msg = await res.text(); toast(msg || 'Could not edit.', 'error'); }
    } catch { toast('Request failed.', 'error'); }
  }

  async function deleteMsg(msgId, btn) {
    if (!confirm('Delete this message?')) return;
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}/messages/${msgId}`, { method: 'DELETE' });
      if (res.ok) { toast('Message deleted.', 'success'); loadMessages(); }
      else { const msg = await res.text(); toast(msg || 'Could not delete.', 'error'); }
    } catch { toast('Request failed.', 'error'); }
  }

  // Post message
  const msgInput = document.getElementById('msgInput');
  const sendBtn  = document.getElementById('sendBtn');

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const content = msgInput.value.trim();
    if (!content) return;
    sendBtn.disabled = true;
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}/messages`, {
        method: 'POST', body: JSON.stringify({ content })
      });
      if (res.ok) {
        msgInput.value = '';
        loadMessages();
      } else {
        const msg = await res.text();
        toast(msg || 'Could not send message.', 'error');
      }
    } catch { toast('Request failed.', 'error'); }
    sendBtn.disabled = false;
  }

  // ── Members ──
  async function loadMembers() {
    const list = document.getElementById('membersList');
    list.className = 'loading'; list.textContent = 'Loading members…';
    try {
      const res = await api(`/api/bookclub/clubs/${clubId}/members`);
      if (!res.ok) throw new Error();
      const members = await res.json();
      if (!members.length) { list.className = ''; list.innerHTML = '<div class="empty">No members found.</div>'; return; }
      const roleClass = { OWNER: 'role-owner', MODERATOR: 'role-moderator', MEMBER: 'role-member' };
      list.className = '';
      list.innerHTML = members.map(m => `
        <div class="member-row">
          <div>
            <div class="member-name">${m.userId === userId ? 'You' : 'User'}</div>
            <div class="member-id">${m.userId}</div>
          </div>
          <div>
            <span class="role-badge ${roleClass[m.role] || ''}">${m.role}</span>
            <div style="font-size:.75rem;color:#94a3b8;margin-top:.2rem;text-align:right">Joined ${new Date(m.joinedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
          </div>
        </div>`).join('');
    } catch {
      list.className = ''; list.innerHTML = '<div class="empty">Could not load members.</div>';
    }
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadClub();
  loadMessages();
</script>
</body>
</html>
